name: 每日日报

on:
  # 目标：北京时间 7 点前日报已经做好、飞书准时推送。
  # GitHub 的定时任务经常晚到一两个小时，所以排三次（北京时间 4:23、5:23、6:23），
  # 当天已经有日报的就直接跳过；做好后飞书推送等到 7 点再发。
  schedule:
    - cron: "23 20 * * *"
    - cron: "23 21 * * *"
    - cron: "23 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-daily
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      date: ${{ steps.day.outputs.date }}
      made: ${{ steps.day.outputs.skip != 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - id: day
        run: |
          d=$(TZ=Asia/Shanghai date +%F)
          echo "date=$d" >> "$GITHUB_OUTPUT"
          # 定时任务排了好几次，今天已经做好的就跳过；手动运行总是重新生成
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "data/daily/$d.json" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "今天（$d）的日报已经有了，这次定时任务跳过。" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v7
        if: steps.day.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: 检查配置
        if: steps.day.outputs.skip != 'true'
        env:
          HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
          OR_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HAS_X: ${{ secrets.TWITTERAPI_IO_KEY != '' }}
          HAS_TIKHUB: ${{ secrets.TIKHUB_API_KEY != '' }}
          HAS_TRUSTMRR: ${{ secrets.TRUSTMRR_API_KEY != '' }}
          HAS_FEISHU: ${{ secrets.FEISHU_WEBHOOK != '' }}
          HAS_KEY: ${{ secrets.ACTION_KEY != '' }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          T_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$T_CLAUDE" ]; then
            # 从终端复制的令牌常被折成两行，去掉空白再交给 Claude
            t=$(printf '%s' "$T_CLAUDE" | tr -d '[:space:]')
            echo "::add-mask::$t"
            echo "CLAUDE_TOKEN=$t" >> "$GITHUB_ENV"
          fi
          ok() { [ "$1" = "true" ] && echo "- ✅ $2" || echo "- ⚠️ $3"; }
          {
            echo "### 配置检查"
            if [ "$HAS_CLAUDE" = "true" ]; then echo "- ✅ Claude 令牌"
            elif [ -n "$OR_KEY" ]; then echo "- ✅ Claude 经 OpenRouter 调用（按量计费）"
            else echo "- ⚠️ 缺少 CLAUDE_CODE_OAUTH_TOKEN（或 ANTHROPIC_API_KEY、OPENROUTER_API_KEY）：日报写不出来"; fi
            ok "$HAS_X" "X 抓取密钥" "缺少 TWITTERAPI_IO_KEY：今天不抓 X，其他来源照常"
            ok "$HAS_TIKHUB" "TikHub 抓取密钥" "缺少 TIKHUB_API_KEY：今天不抓抖音、小红书等平台，其他来源照常"
            ok "$HAS_TRUSTMRR" "TrustMRR 密钥" "缺少 TRUSTMRR_API_KEY（可选）：机会卡的收入证据由模型自己打开页面找"
            ok "$HAS_FEISHU" "飞书机器人" "缺少 FEISHU_WEBHOOK：不推送飞书"
            ok "$HAS_KEY" "收藏口令" "缺少 ACTION_KEY：飞书卡片上没有收藏按钮"
            w="${WORKER_URL:-$(python3 -c 'import json;print(json.load(open("config/site.json")).get("worker_url",""))')}"
            [ -n "$w" ] && echo "- ✅ 收藏接口 $w" || echo "- ⚠️ 收藏接口没配：仓库变量 WORKER_URL 和 config/site.json 的 worker_url 都空着，网站和飞书上的收藏按钮不可用（配法见 docs/setup.md 第 7、8 步）"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$HAS_CLAUDE" != "true" ] && [ -n "$OR_KEY" ]; then
            # 没有 Claude 令牌时改走 OpenRouter 的 Anthropic 兼容接口（OpenRouter 官方的 Claude Code 接法）
            { echo "ANTHROPIC_BASE_URL=https://openrouter.ai/api"; echo "ANTHROPIC_AUTH_TOKEN=$OR_KEY"; } >> "$GITHUB_ENV"
          elif [ "$HAS_CLAUDE" != "true" ]; then
            echo "::error::还没配置 CLAUDE_CODE_OAUTH_TOKEN（或 ANTHROPIC_API_KEY、OPENROUTER_API_KEY），按配置指南加到仓库的 Actions secrets 里。"
            exit 1
          fi

      - name: 抓取原始素材
        if: steps.day.outputs.skip != 'true'
        run: python3 scripts/fetch.py --date "${{ steps.day.outputs.date }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          TIKHUB_API_KEY: ${{ secrets.TIKHUB_API_KEY }}
          TRUSTMRR_API_KEY: ${{ secrets.TRUSTMRR_API_KEY }}

      - name: Claude 写日报
        id: claude
        if: steps.day.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY || (env.ANTHROPIC_BASE_URL != '' && secrets.OPENROUTER_API_KEY) || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            今天是 ${{ steps.day.outputs.date }}（北京时间）。请严格按 prompts/daily.md 写今天的日报。
            原始素材：data/raw/${{ steps.day.outputs.date }}.json
            输出文件：data/daily/${{ steps.day.outputs.date }}.json
          claude_args: >-
            --model ${{ vars.DAILY_MODEL || 'sonnet' }}
            --max-turns 120
            --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,Bash(python3 scripts/validate.py:*)"

      - name: 查 Claude 出错原因
        if: failure() && steps.claude.outcome == 'failure'
        run: python3 scripts/claude_error.py "${{ steps.claude.outputs.execution_file }}"

      - name: 从 README 配图
        if: steps.day.outputs.skip != 'true'
        run: python3 scripts/enrich.py "data/daily/${{ steps.day.outputs.date }}.json" || echo "配图失败，跳过"

      - name: 校验
        if: steps.day.outputs.skip != 'true'
        run: python3 scripts/validate.py "data/daily/${{ steps.day.outputs.date }}.json"

      - name: 提交
        if: steps.day.outputs.skip != 'true'
        run: |
          git config user.name "ai-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily
          git commit -m "日报 ${{ steps.day.outputs.date }}" || exit 0
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1

  publish:
    needs: generate
    if: needs.generate.outputs.made == 'true'
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  notify:
    needs: [generate, publish]
    if: always() && needs.generate.outputs.made != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: 推送飞书
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          ACTION_KEY: ${{ secrets.ACTION_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OK: ${{ needs.generate.result == 'success' && needs.publish.result == 'success' }}
          DAY: ${{ needs.generate.outputs.date }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$FEISHU_WEBHOOK" ]; then echo "没配置飞书机器人，跳过推送"; exit 0; fi
          now=$(date +%s); seven=$(TZ=Asia/Shanghai date -d "07:00" +%s)
          if [ "$OK" = "true" ]; then
            # 定时任务做好得早，推送等到北京时间 7 点，不在半夜打扰
            if [ "$EVENT" = "schedule" ] && [ "$seven" -gt "$now" ]; then
              echo "等到北京时间 7 点再推送（还有 $(( (seven - now) / 60 )) 分钟）"
              sleep $((seven - now))
            fi
            python3 scripts/notify_feishu.py daily "$DAY"
          elif [ "$EVENT" = "schedule" ] && [ "$(TZ=Asia/Shanghai date +%H)" -lt 6 ]; then
            echo "这次没做成，6 点前后还会再试一次，先不发失败通知"
          else
            python3 scripts/notify_feishu.py error "今天的日报没有生成成功，点下面的按钮看运行记录。"
          fi
