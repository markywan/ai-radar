name: 收藏与深挖

on:
  repository_dispatch:
    types: [favorite, deepdive]
  workflow_dispatch:
    inputs:
      id:
        description: "条目编号，例如 2026-10-15-B01"
        required: true
      deep:
        description: "同时深挖"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  save:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.p.outputs.id }}
      deep: ${{ steps.p.outputs.deep }}
    steps:
      - uses: actions/checkout@v7
      - id: p
        env:
          RAW_ID: ${{ github.event.client_payload.id || inputs.id }}
          IS_DEEP: ${{ github.event.action == 'deepdive' || inputs.deep == true }}
        run: |
          if ! [[ "$RAW_ID" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[NGSB][0-9]{2}$ ]]; then
            echo "编号不合法：$RAW_ID"; exit 1
          fi
          echo "id=$RAW_ID" >> "$GITHUB_OUTPUT"
          echo "deep=$IS_DEEP" >> "$GITHUB_OUTPUT"
      - name: 写入收藏
        run: python3 scripts/favorite.py add "${{ steps.p.outputs.id }}" ${{ steps.p.outputs.deep == 'true' && '--deep' || '' }}
      - name: 提交
        run: |
          git config user.name "ai-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/favorites
          git commit -m "收藏 ${{ steps.p.outputs.id }}" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 4))
          done
          exit 1

  deep:
    needs: save
    if: needs.save.outputs.deep == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: deep-${{ needs.save.outputs.id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - id: chk
        name: 已经深挖过就跳过
        run: |
          if [ -s "data/deepdive/${{ needs.save.outputs.id }}.md" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "已有深挖结果，不重复跑"
          fi
      - uses: actions/setup-python@v7
        if: steps.chk.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Claude 深挖
        if: steps.chk.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            请按 prompts/deepdive.md 深挖收藏条目 ${{ needs.save.outputs.id }}。
            条目在 data/favorites/${{ needs.save.outputs.id }}.json，结果写到 data/deepdive/${{ needs.save.outputs.id }}.md。
          claude_args: >-
            --model ${{ vars.DEEPDIVE_MODEL || 'opus' }}
            --max-turns 80
            --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"
      - name: 提交
        if: steps.chk.outputs.skip != 'true'
        run: |
          test -s "data/deepdive/${{ needs.save.outputs.id }}.md"
          python3 scripts/favorite.py done "${{ needs.save.outputs.id }}"
          git config user.name "ai-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deepdive data/favorites
          git commit -m "深挖 ${{ needs.save.outputs.id }}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 4))
          done
          exit 1

  publish:
    needs: [save, deep]
    if: always() && needs.save.result == 'success' && needs.deep.result != 'failure' && needs.deep.result != 'cancelled'
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  notify:
    needs: [save, deep, publish]
    if: always() && needs.save.outputs.deep == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: 推送飞书
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          ACTION_KEY: ${{ secrets.ACTION_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OK: ${{ needs.deep.result == 'success' && needs.publish.result == 'success' }}
          FID: ${{ needs.save.outputs.id }}
        run: |
          if [ "$OK" = "true" ]; then
            python3 scripts/notify_feishu.py deepdive "$FID"
          else
            python3 scripts/notify_feishu.py error "深挖 $FID 没有完成，点下面的按钮看运行记录。"
          fi
